<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel de informes — Atentus</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Informes interactivos</p>
          <h1>Panel de informes</h1>
        </div>
        <div class="topbar-actions">
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Cambiar a modo oscuro"
          >
            <span aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <nav id="moduleTabs" class="module-tabs" aria-label="Módulos"></nav>
      <nav id="pageTabs" class="page-tabs" aria-label="Páginas"></nav>

      <section id="pageContainer"></section>
    </main>

    <div id="tooltip" class="tooltip" hidden></div>

    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./vendor/d3.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
